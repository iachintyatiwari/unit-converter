<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    
    <div class="main" style="margin: bottom 100px;;" >
        <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
            <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
            <label class="btn btn-outline-primary" for="btnradio1">LENGTH</label>
          
            <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
            <label class="btn btn-outline-primary" for="btnradio2">WEIGHT</label>
          
            <input type="radio" class="btn-check" name="btnradio" id="btnradio3" autocomplete="off">
            <label class="btn btn-outline-primary" for="btnradio3">TEMPRATURE</label>
          </div>

          <div class="row g-2" >
            <div class="col-md">
              <div class="form-floating">
                <select class="form-select"  id="s1">
                </select>
              
              </div>
            </div>
            <div class="col-md">
                <div class="form-floating">
                  <select class="form-select"  id="s2">
                  </select>
                 
                </div>
              </div>
          </div>

          <div class="input-group">
            <input type="number" aria-label="First name" class="form-control" id="v" placeholder="Enter your first number">
          </div>
          <button type="button" class="btn btn-primary">Submit</button>
        

          <div class="output">
            <p id="output"></p>
          </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="index.js" type="module"></script>
</body>
</body> 
</html>
